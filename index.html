<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IRIS Digital Lab — We build brands that mean business</title>
    <meta name="description" content="Website development & brand identity design for South Florida companies ready to grow." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>

    <!-- Netlify form detection (hidden) — keeps the React form working with Netlify Forms -->
    <form name="quote" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="company" />
      <input type="text" name="services" />
      <input type="text" name="budget" />
      <input type="text" name="timeline" />
      <textarea name="details"></textarea>
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
